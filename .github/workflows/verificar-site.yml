   name: Verificar site

   on:
     push:
       branches: [ "main" ]
     pull_request:
       branches: [ "main" ]

   jobs:
     verificar:
       runs-on: ubuntu-latest
       steps:
         - name: Baixar o código
           uses: actions/checkout@v4

         - name: Instalar validador de HTML
           run: pip install html5validator

         - name: Validar HTML
           run: html5validator --root . --ignore-re 'CSS:' 'The text content of element "time"'

         - name: Verificar links
           uses: lycheeverse/lychee-action@v2
           with:
             args: --no-progress --accept 200,204,206,403,429,999 --max-retries 3 --timeout 20 './index.html' './README.md'
             fail: true
